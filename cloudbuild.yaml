# Cloud Build pipeline: build the Docker image, push to Artifact Registry,
# and deploy to Cloud Run. Trigger this either:
#   - from Cloud Shell:  gcloud builds submit --config cloudbuild.yaml
#   - or via a Cloud Build trigger connected to your GitHub branch.
#
# Substitutions (set in trigger or via --substitutions):
#   _REGION:        Cloud Run region (default us-central1)
#   _SERVICE:       Cloud Run service name (default geidea-dashboard)
#   _DASH_USERNAME, _DASH_PASSWORD, _SESSION_SECRET: app secrets
#   _BQ_DATASET, _BQ_TABLE: BigQuery target

substitutions:
  _REGION: us-central1
  _SERVICE: geidea-dashboard
  _BQ_DATASET: geidea
  _BQ_TABLE: geidea_order_items
  _DASH_USERNAME: admin
  _DASH_PASSWORD: change-me
  _SESSION_SECRET: change-me-too

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID]

  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/${_SERVICE}:latest]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,BQ_DATASET=${_BQ_DATASET},BQ_TABLE=${_BQ_TABLE},DASH_USERNAME=${_DASH_USERNAME},DASH_PASSWORD=${_DASH_PASSWORD},SESSION_SECRET=${_SESSION_SECRET},NODE_ENV=production

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest
